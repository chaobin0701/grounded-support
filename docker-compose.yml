services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grounded_support}
      POSTGRES_USER: ${POSTGRES_USER:-grounded}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./server
    image: grounded-support-server:local
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-grounded}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-grounded_support}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./server
    image: grounded-support-server:local
    command: ["node", "dist/main.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-grounded}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-grounded_support}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-grounded-support}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-grounded-support-admin}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-900}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/data/uploads}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      CHAT_RATE_WINDOW_MS: ${CHAT_RATE_WINDOW_MS:-60000}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-10}
      CHAT_CONCURRENCY: ${CHAT_CONCURRENCY:-5}
      ADMIN_LOGIN_RATE_WINDOW_MS: ${ADMIN_LOGIN_RATE_WINDOW_MS:-60000}
      ADMIN_LOGIN_RATE_LIMIT: ${ADMIN_LOGIN_RATE_LIMIT:-5}
      DOCUMENT_UPLOAD_RATE_WINDOW_MS: ${DOCUMENT_UPLOAD_RATE_WINDOW_MS:-60000}
      DOCUMENT_UPLOAD_RATE_LIMIT: ${DOCUMENT_UPLOAD_RATE_LIMIT:-50}
      DOCUMENT_UPLOAD_CONCURRENCY: ${DOCUMENT_UPLOAD_CONCURRENCY:-2}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-doubao-embedding-vision-251215}
      EMBEDDING_CONNECTIONS_JSON: ${EMBEDDING_CONNECTIONS_JSON:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-1-flash-260910}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
      LLM_CONTEXT_WINDOW_TOKENS: ${LLM_CONTEXT_WINDOW_TOKENS:-32000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-auto}
      LLM_ALLOWED_BASE_URLS: ${LLM_ALLOWED_BASE_URLS:-https://ark.cn-beijing.volces.com/api/v3}
      PORT: "3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./server
    image: grounded-support-server:local
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-grounded}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-grounded_support}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/data/uploads}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-doubao-embedding-vision-251215}
      EMBEDDING_CONNECTIONS_JSON: ${EMBEDDING_CONNECTIONS_JSON:-}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
